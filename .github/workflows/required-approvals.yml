name: required-approvals

on:
  pull_request:
    branches:
      - main
    paths:
      - 'testdata/required-approvals/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  required-approvals-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check PR approvals
        id: approvals
        uses: step-security/required-approvals@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          read_org_scoped_token: ${{ secrets.MEMBERS_PERMS_SUBS_TEST }}
          org_name: anurags-org-returns
          min_approvals: 1

      - name: Show result
        run: |
          echo "Approved: ${{ steps.approvals.outputs.approved }}"
          echo "Reason: ${{ steps.approvals.outputs.reason }}"

      - name: Cleanup - close PR and delete branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUM" \
            --delete-branch \
            --comment "Smoke test complete. Approved: ${{ steps.approvals.outputs.approved }}. Reason: ${{ steps.approvals.outputs.reason }}"
